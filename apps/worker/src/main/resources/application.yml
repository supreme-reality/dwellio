spring:
  application:
    name: dwellio-worker
  main:
    web-application-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dwellio}
    username: ${SPRING_DATASOURCE_USERNAME:dwellio}
    password: ${SPRING_DATASOURCE_PASSWORD:dwellio}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

dwellio:
  worker:
    # billing | invoice — set via WORKER_ROLE so one image can run as separate ECS services
    role: ${WORKER_ROLE:}
  invoice-worker:
    poll-enabled: true
    poll-delay-ms: 5000
