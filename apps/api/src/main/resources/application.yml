server:
  port: 8080

spring:
  application:
    name: dwellio-api
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dwellio}
    username: ${SPRING_DATASOURCE_USERNAME:dwellio}
    password: ${SPRING_DATASOURCE_PASSWORD:dwellio}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://YOUR_TENANT.us.auth0.com/}

dwellio:
  auth0:
    audience: ${AUTH0_AUDIENCE:https://api.dwellio.local}
  razorpay:
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  storage:
    type: ${DWELLIO_STORAGE_TYPE:s3}
    bucket: ${DWELLIO_DOCUMENTS_BUCKET:dwellio-documents}
    region: ${DWELLIO_S3_REGION:us-east-1}
    endpoint: ${DWELLIO_S3_ENDPOINT:http://localhost:9000}
    access-key: ${DWELLIO_S3_ACCESS_KEY:dwellio}
    secret-key: ${DWELLIO_S3_SECRET_KEY:dwellio-secret}
    path-style: ${DWELLIO_S3_PATH_STYLE:true}
    presign-ttl-seconds: ${DWELLIO_S3_PRESIGN_TTL:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
