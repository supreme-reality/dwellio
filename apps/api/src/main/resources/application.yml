server:
  port: 8080

spring:
  application:
    name: dwellio-api
  datasource:
    url: jdbc:postgresql://localhost:5433/dwellio
    username: dwellio
    password: dwellio
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
