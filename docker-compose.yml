services:
  postgres:
    image: postgres:15
    container_name: dwellio-postgres
    environment:
      POSTGRES_DB: dwellio
      POSTGRES_USER: dwellio
      POSTGRES_PASSWORD: dwellio
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwellio -d dwellio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
