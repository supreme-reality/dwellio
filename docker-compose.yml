services:
  postgres:
    image: postgres:15
    container_name: dwellio-postgres
    environment:
      POSTGRES_DB: dwellio
      POSTGRES_USER: dwellio
      POSTGRES_PASSWORD: dwellio
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwellio -d dwellio"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: dwellio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dwellio
      MINIO_ROOT_PASSWORD: dwellio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    container_name: dwellio-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 dwellio dwellio-secret;
      mc mb -p local/dwellio-documents || true;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
