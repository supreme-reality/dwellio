# Build API + worker images → ECR → update ECS (api, billing, invoice).
# Auth: GitHub OIDC → IAM deploy role (no long-lived AWS keys).
#
# Branch targeting:
#   push to `dev`  → DEV ECR + ECS (dwellio-dev-*)
#   push to `main` → PROD ECR + ECS (dwellio-prod-*)
#   workflow_dispatch environment input overrides the branch mapping
#
# Required GitHub Variables (after Terraform apply per environment):
#   AWS_REGION=ap-south-1
#   AWS_ROLE_ARN_DEPLOY_DEV=<dev output gha_deploy_role_arn>
#   ECS_CLUSTER_DEV=<dev output ecs_cluster_name>                 e.g. dwellio-dev
#   ECR_API_REPOSITORY_DEV=<dev output api_ecr_repository_url>
#   ECR_WORKER_REPOSITORY_DEV=<dev output worker_ecr_repository_url>
#   AWS_ROLE_ARN_DEPLOY_PROD=<prod output gha_deploy_role_arn>
#   ECS_CLUSTER_PROD=<prod output ecs_cluster_name>               e.g. dwellio-prod
#   ECR_API_REPOSITORY_PROD=<prod output api_ecr_repository_url>
#   ECR_WORKER_REPOSITORY_PROD=<prod output worker_ecr_repository_url>

name: API deploy

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'prod' && 'production' || 'development') || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve env config
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_DEPLOY_DEV }}
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN_DEPLOY_PROD }}
          CLUSTER_DEV: ${{ vars.ECS_CLUSTER_DEV }}
          CLUSTER_PROD: ${{ vars.ECS_CLUSTER_PROD }}
          ECR_API_DEV: ${{ vars.ECR_API_REPOSITORY_DEV }}
          ECR_API_PROD: ${{ vars.ECR_API_REPOSITORY_PROD }}
          ECR_WORKER_DEV: ${{ vars.ECR_WORKER_REPOSITORY_DEV }}
          ECR_WORKER_PROD: ${{ vars.ECR_WORKER_REPOSITORY_PROD }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENV="$DISPATCH_ENV"
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            ENV="prod"
          elif [ "$GIT_REF" = "refs/heads/dev" ]; then
            ENV="dev"
          else
            echo "Unsupported ref for deploy: $GIT_REF" >&2
            exit 1
          fi

          require() {
            if [ -z "$1" ]; then
              echo "Missing required GitHub variable: $2" >&2
              exit 1
            fi
          }

          if [ "$ENV" = "prod" ]; then
            ROLE="$ROLE_PROD"
            CLUSTER="$CLUSTER_PROD"
            ECR_API="$ECR_API_PROD"
            ECR_WORKER="$ECR_WORKER_PROD"
            require "$ROLE" AWS_ROLE_ARN_DEPLOY_PROD
            require "$CLUSTER" ECS_CLUSTER_PROD
            require "$ECR_API" ECR_API_REPOSITORY_PROD
            require "$ECR_WORKER" ECR_WORKER_REPOSITORY_PROD
          else
            ROLE="$ROLE_DEV"
            CLUSTER="$CLUSTER_DEV"
            ECR_API="$ECR_API_DEV"
            ECR_WORKER="$ECR_WORKER_DEV"
            require "$ROLE" AWS_ROLE_ARN_DEPLOY_DEV
            require "$CLUSTER" ECS_CLUSTER_DEV
            require "$ECR_API" ECR_API_REPOSITORY_DEV
            require "$ECR_WORKER" ECR_WORKER_REPOSITORY_DEV
          fi

          echo "Deploy target: $ENV"
          echo "Cluster: $CLUSTER"
          echo "ECR API: $ECR_API"
          echo "ECR worker: $ECR_WORKER"

          {
            echo "env=$ENV"
            echo "role=$ROLE"
            echo "cluster=$CLUSTER"
            echo "ecr_api=$ECR_API"
            echo "ecr_worker=$ECR_WORKER"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.cfg.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"
          echo "api_image=${{ steps.cfg.outputs.ecr_api }}:$SHA" >> "$GITHUB_OUTPUT"
          echo "api_latest=${{ steps.cfg.outputs.ecr_api }}:latest" >> "$GITHUB_OUTPUT"
          echo "worker_image=${{ steps.cfg.outputs.ecr_worker }}:$SHA" >> "$GITHUB_OUTPUT"
          echo "worker_latest=${{ steps.cfg.outputs.ecr_worker }}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ steps.meta.outputs.api_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.worker_image }}
            ${{ steps.meta.outputs.worker_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --service api \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Deploy billing + invoice (shared worker image)
        run: |
          # Task definitions already set WORKER_ROLE=billing|invoice and image :latest.
          # Force new deployment so both services pull the new worker image.
          aws ecs update-service \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --service billing \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
          aws ecs update-service \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --service invoice \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
